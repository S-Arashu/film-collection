@if (film()) {
  <div class="detail-page">
    <button class="back-btn" (click)="goBack()">← Назад</button>

    <div class="hero">
      <img [src]="film()!.posterUrl" [alt]="film()!.title" class="poster" />
      <div class="details">
        <h1>{{ film()!.title }}</h1>
        <p class="meta">{{ film()!.year }} · {{ film()!.genre }}</p>
        <p>⭐ {{ film()!.rating }} / 10</p>
        <p>⏱ {{ film()!.duration | duration }}</p>

        <button
          class="fav-btn"
          [class.active]="film()!.isFavorite"
          (click)="toggleFavorite()"
        >
          {{ film()!.isFavorite ? "★ В избранном" : "☆ В избранное" }}
        </button>
      </div>
    </div>

    <p class="description">{{ film()!.description }}</p>
  </div>
} @else {
  <p>Фильм не найден.</p>
}
